<h3>Nuevo Libro</h3>
<form onsubmit="alert('Libro agregado (simulado)'); return false;">
    <label>Título:<br><input type="text" required></label><br><br>
    <label>Autor(es):<br><input type="text" required></label><br><br>
    <label>ISBN:<br><input type="text" required></label><br><br>
    <label>Género(s):<br>
        <select multiple required>
            <option value="ficcion">Ficción</option>
            <option value="fantasia">Fantasía</option>
        </select>
    </label><br><br>
    <label>Año de publicación:<br><input type="number" required></label><br><br>
    <label>Editorial:<br><input type="text" required></label><br><br>
    <label>Número de páginas:<br><input type="number" required></label><br><br>
    <label>Sinopsis:<br><textarea rows="4" required></textarea></label><br><br>
    <label>Portada:<br><input type="file" accept="image/*" required></label><br><br>
    <button type="submit" style="padding: 0.5rem 1rem; background-color: #2196F3; color: white; border: none; border-radius: 6px; cursor: pointer;">
        Guardar Libro
    </button>
</form>
